<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌉 TalkBridge</h1>
      <p class="tagline">YouTube Translator & Q&A</p>
    </div>

    <div class="status">
      <div id="status-indicator" class="status-dot inactive"></div>
      <span id="status-text">Not on YouTube</span>
    </div>

    <div class="settings">
      <div class="setting-group">
        <label for="gemini-api-key">Gemini API Key:</label>
        <input type="password" id="gemini-api-key" placeholder="Enter your Gemini API key">
        <small><a href="https://makersuite.google.com/app/apikey" target="_blank">Get free API key</a></small>
      </div>

      <div class="setting-group">
        <label>
          <input type="checkbox" id="enable-translation">
          Enable Translation
        </label>
      </div>

      <div class="setting-group" id="language-group">
        <label for="target-language">Target Language:</label>
        <select id="target-language">
          <option value="">Select language...</option>
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Italian">Italian</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Russian">Russian</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean">Korean</option>
          <option value="Chinese">Chinese</option>
          <option value="Hindi">Hindi</option>
          <option value="Arabic">Arabic</option>
        </select>
      </div>

      <div class="setting-group">
        <label>
          <input type="checkbox" id="enable-qa">
          Enable Q&A Panel
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="save-settings" class="btn btn-primary">Save Settings</button>
    </div>

    <div class="footer">
      <p>Watch YouTube videos in your language</p>
      <p class="version">v1.0.0</p>
    </div>
  </div>

  <script src="popup-standalone.js"></script>
</body>
</html>
