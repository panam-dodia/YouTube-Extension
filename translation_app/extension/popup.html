<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 100%);
            color: white;
            margin: 0;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 13px;
            line-height: 1.6;
            color: #a0a0b0;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #0f0c29;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 6px;
            font-size: 11px;
            color: #00ff88;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>🌐 Live Translator</h1>
    <p>Translate audio to any language in real-time</p>

    <button id="toggleBtn">Show Translator</button>

    <div id="status" class="status"></div>

    <div class="info">
        <strong>How to use:</strong><br>
        1. Enter OpenAI API key<br>
        2. Select target language<br>
        3. Play video and click "Start Translation"
    </div>

    <script src="popup.js"></script>
</body>
</html>
